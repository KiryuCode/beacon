# First-install HTTP template for Beacon (Canopy Harbor LLC).
# After DNS: certbot --nginx -d beacon.adavis.cloud --redirect
# Container: 127.0.0.1:4843  (docker compose in /var/www/beacon)

server {
    listen 80;
    listen [::]:80;
    server_name beacon.adavis.cloud;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:4843;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        client_max_body_size 8m;
    }
}
